name: CI

on:
  push:
    branches: [main]
  pull_request:

# Аудит IR-059: параллельные прогоны одной ветки отменяют друг друга,
# зависший шаг убивается по таймауту, права минимальны
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: unichat
          POSTGRES_USER: unichat
          POSTGRES_PASSWORD: unichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unichat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # версия берётся из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (без DATABASE_URL — e2e-файлы пропускаются)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bootstrap smoke (DI-граф AppModule без БД — docs/18 §5)
        run: pnpm --filter @uni-chat/api smoke

      - name: Migrations on clean DB (docs/06 §8)
        run: node apps/api/dist/migrate.js
        env:
          DATABASE_URL: postgres://unichat:unichat@localhost:5432/unichat

      - name: E2E Phase 1-5 (auth/RBAC/settings, widget/realtime, AI/RAG, эскалация, sites/analytics против реальной БД)
        # только e2e-глоб: юниты уже прогнаны шагом выше (двойной прогон — аудит IR-059)
        run: pnpm --filter @uni-chat/api test:e2e
        env:
          DATABASE_URL: postgres://unichat:unichat@localhost:5432/unichat
          APP_SECRET: ci-app-secret-0123456789
          SETUP_TOKEN: ci-setup-token-42

      - name: Migrations are idempotent (повторный прогон — no-op)
        run: node apps/api/dist/migrate.js
        env:
          DATABASE_URL: postgres://unichat:unichat@localhost:5432/unichat

      - name: Dependency boundaries (docs/04 §4)
        run: pnpm check:deps

      - name: Widget size budget (NFR-5)
        run: pnpm check:widget-size
