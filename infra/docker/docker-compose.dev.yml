# Dev-инфраструктура: только БД и Redis (docs/23_DEVELOPER_GUIDE.md).
# Прод-стек (api/worker/caddy/backup) — Фаза 7, infra/docker/docker-compose.prod.yml.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: unichat
      POSTGRES_USER: unichat
      POSTGRES_PASSWORD: unichat
    ports:
      - "5432:5432"
    volumes:
      - unichat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unichat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - unichat_redisdata:/data

volumes:
  unichat_pgdata: {}
  unichat_redisdata: {}
